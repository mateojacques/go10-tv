plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'blog.go10'
version = '0.1.0'

android {
  namespace "blog.go10.embedbridge"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // The WebView we inject into and tap; its own androidx.webkit version.
  implementation project(':react-native-webview')
  implementation 'androidx.webkit:webkit:1.14.0'
}
